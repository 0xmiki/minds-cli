name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish npm package and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node for npm publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Match tag to package version
        run: |
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); const source = readFileSync("src/version.ts", "utf8"); if (!source.includes(`export const MINDS_VERSION = "${pkg.version}";`)) throw new Error("CLI and package versions differ");'

      - name: Install dependencies
        run: bun ci

      - name: Verify
        run: |
          bun run typecheck
          bun test
        env:
          DEBUG: ""

      - name: Build
        run: bun run build

      - name: Pack release archive
        run: |
          bun pm pack --filename minds-cli.tgz
          tar -tzf minds-cli.tgz | grep -q '^package/dist/index.js$'
          tar -tzf minds-cli.tgz | grep -q '^package/dist/app.js$'
          tar -tzf minds-cli.tgz | grep -q '^package/minds/Aristotle/mind.json$'
          sha256sum minds-cli.tgz > minds-cli.tgz.sha256

      - name: Test installation of release archive
        run: |
          RELEASE_SMOKE_DIR=$(mktemp -d)
          printf '{"private":true}' > "$RELEASE_SMOKE_DIR/package.json"
          bun add --cwd "$RELEASE_SMOKE_DIR" "$GITHUB_WORKSPACE/minds-cli.tgz"
          "$RELEASE_SMOKE_DIR/node_modules/.bin/minds" --version
          MINDS_DATA_DIR="$RELEASE_SMOKE_DIR/data" "$RELEASE_SMOKE_DIR/node_modules/.bin/minds" list

      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish ./minds-cli.tgz --access public --tag next
          else
            npm publish ./minds-cli.tgz --access public --tag latest
          fi

      - name: Publish GitHub release
        run: |
          RELEASE_FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" minds-cli.tgz minds-cli.tgz.sha256 --title "Minds ${GITHUB_REF_NAME}" --generate-notes "${RELEASE_FLAGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
